[project]
name = "agent-latency-tracer"
version = "0.1.0"
description = "Reproducing common latency pitfalls in an LLM agent (self-hosted LLM, MCP tools, RAG) and finding what instrumentation tells them apart."
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    # X-Ray-format trace IDs, so the CloudWatch console can open any trace
    "opentelemetry-sdk-extension-aws>=2.0",
    "numpy>=1.25",
    "faiss-cpu>=1.9",
    # Pinned: v2 API, and the server-side OTel middleware is still provisional.
    "mcp==2.3.0",
    "opentelemetry-instrumentation-asgi>=0.48b0",
    "httpx2>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
rds = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",  # registers the vector type with psycopg (COPY in binary)
]
aws = [
    # tracing/aws_exporter.py: OTLP/HTTP to CloudWatch, signed with SigV4
    "botocore>=1.35",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

plot = [
    "matplotlib>=3.8",  # scripts/plot_breakdown.py: the README's breakdown figure
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracing*", "system*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
