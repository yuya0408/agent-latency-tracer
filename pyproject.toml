[project]
name = "agent-latency-tracer"
version = "0.1.0"
description = "Reproducing common latency pitfalls in an LLM agent (self-hosted LLM, MCP tools, RAG) and finding what instrumentation tells them apart."
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "numpy>=1.25",
    "faiss-cpu>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracing*", "system*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
