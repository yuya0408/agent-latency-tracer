# Relays the engine's spans to CloudWatch: vLLM's exporter can't sign with SigV4,
# and the endpoint doesn't take gRPC (docs/DESIGN.md §1). No processors: spans
# pass through unchanged.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

exporters:
  otlphttp/traces:
    compression: gzip
    traces_endpoint: https://xray.ap-northeast-1.amazonaws.com/v1/traces
    auth:
      authenticator: sigv4auth/traces

extensions:
  sigv4auth/traces:
    region: ap-northeast-1
    service: xray

service:
  extensions: [sigv4auth/traces]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/traces]
