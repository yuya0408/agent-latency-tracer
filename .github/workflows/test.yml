name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    # The same image the runbook uses locally, so test_pgvector_pool runs
    # instead of skipping. It lives only for this job.
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_PASSWORD: local
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # aws: botocore for test_memory's Stubber (no AWS calls). rds: psycopg for
      # test_pgvector_pool.
      - run: pip install -e ".[dev,aws,rds]"

      - run: python -m pytest -q -rs
